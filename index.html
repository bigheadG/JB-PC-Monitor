<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>JB People Counter Monitor</title>
<style>
:root{--bg:#0b1020;--card:#131a2d;--card2:#101625;--text:#f5f7fb;--muted:#9aa6bf;--line:#26304a;--good:#23c483;--bad:#ff5d73;--warn:#ffb020;--accent:#55d6ff;--accent2:#8ee6ff;--shadow:0 10px 28px rgba(0,0,0,.28);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#0d1426);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
.wrap{width:min(960px,100%);margin:0 auto;padding:18px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.title-wrap h1{margin:0;font-size:clamp(24px,5vw,38px)}.subtitle{color:var(--muted);margin-top:4px;font-size:14px}
.status-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#0f1525;padding:9px 12px;border-radius:999px;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.metric-label{color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.08em}.metric-value{font-size:clamp(46px,12vw,84px);line-height:1;font-weight:800;margin-top:8px}
.in-card .metric-value{color:#65e5a8}.out-card .metric-value{color:#ff8b9a}.occ-card .metric-value{color:var(--accent2)}.wide{grid-column:1/-1}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.detail{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0d1322}.detail .k{color:var(--muted);font-size:12px;margin-bottom:4px}.detail .v{font-weight:750;word-break:break-word}
details{margin-top:14px}summary{cursor:pointer;font-weight:750;color:var(--accent2)}.settings{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}label{color:var(--muted);font-size:12px;display:block;margin-bottom:5px}input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0a1020;color:var(--text)}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}button{border:0;padding:11px 16px;border-radius:12px;font-weight:800;cursor:pointer;background:var(--accent);color:#06111a}button.secondary{background:#1e2942;color:var(--text);border:1px solid var(--line)}
.footer,.small{color:var(--muted);font-size:12px}.footer{text-align:center;margin:18px 0 8px}.small{margin-top:8px;line-height:1.45}
@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.details{grid-template-columns:1fr 1fr}.settings{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}}
</style>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
<main class="wrap">
<div class="header">
  <div class="title-wrap"><h1>JB People Counter</h1><div class="subtitle">Remote IN / OUT Monitor</div></div>
  <div class="status-pill"><span id="statusDot" class="dot"></span><span id="mqttStatus">DISCONNECTED</span></div>
</div>
<section class="grid">
  <div class="card in-card"><div class="metric-label">IN</div><div id="inCount" class="metric-value">0</div></div>
  <div class="card out-card"><div class="metric-label">OUT</div><div id="outCount" class="metric-value">0</div></div>
  <div class="card occ-card wide">
    <div class="metric-label">OCCUPANCY</div><div id="occupancy" class="metric-value">0</div>
    <div class="details">
      <div class="detail"><div class="k">FN</div><div id="fn" class="v">--</div></div>
      <div class="detail"><div class="k">TRACKS</div><div id="tracks" class="v">0</div></div>
      <div class="detail"><div class="k">EVENT</div><div id="eventState" class="v">IDLE</div></div>
      <div class="detail"><div class="k">LAST EVENT</div><div id="lastEvent" class="v">--</div></div>
      <div class="detail"><div class="k">LAST UPDATE</div><div id="lastUpdate" class="v">--</div></div>
      <div class="detail"><div class="k">TOPIC</div><div id="topicView" class="v">ghfc/counter</div></div>
    </div>
  </div>
  <div class="card wide">
    <div class="metric-label">MQTT</div>
    <div class="small">Broker: <strong>wss://jbnas03.synology.me:8084/mqtt</strong></div>
    <details>
      <summary>Advanced Settings</summary>
      <div class="settings">
        <div><label for="topicInput">Topic</label><input id="topicInput" value="ghfc/counter"></div>
        <div><label for="userInput">Username</label><input id="userInput" autocomplete="username"></div>
        <div><label for="passInput">Password</label><input id="passInput" type="password" autocomplete="current-password"></div>
      </div>
      <div class="actions">
        <button id="applyBtn">APPLY & RECONNECT</button>
        <button id="resetBtn" class="secondary">RESET DEFAULT</button>
      </div>
    </details>
  </div>
</section>
<div class="footer">JB People Counter Monitor</div>
</main>
<script>
(() => {
const BROKER_WEBSOCKET_URL="wss://jbnas03.synology.me:8084/mqtt";
const DEFAULT_TOPIC="ghfc/counter";
let client=null;
let activeTopic=localStorage.getItem("jb_pc_topic")||DEFAULT_TOPIC;
const $=id=>document.getElementById(id);
const el={inCount:$("inCount"),outCount:$("outCount"),occupancy:$("occupancy"),fn:$("fn"),tracks:$("tracks"),eventState:$("eventState"),lastEvent:$("lastEvent"),lastUpdate:$("lastUpdate"),mqttStatus:$("mqttStatus"),statusDot:$("statusDot"),topicView:$("topicView"),topicInput:$("topicInput"),userInput:$("userInput"),passInput:$("passInput"),applyBtn:$("applyBtn"),resetBtn:$("resetBtn")};
el.topicInput.value=activeTopic;
el.userInput.value=localStorage.getItem("jb_pc_user")||"";
el.passInput.value=localStorage.getItem("jb_pc_pass")||"";
el.topicView.textContent=activeTopic;

function setStatus(text,ok){
  el.mqttStatus.textContent=text;
  el.statusDot.style.background=ok?"#23c483":"#ff5d73";
  el.statusDot.style.boxShadow=ok?"0 0 12px rgba(35,196,131,.5)":"0 0 12px rgba(255,93,115,.5)";
}
function n(v,d=0){const x=Number(v);return Number.isFinite(x)?x:d}
function updatePayload(data){
  const i=n(data.in,0),o=n(data.out,0);
  el.inCount.textContent=i; el.outCount.textContent=o; el.occupancy.textContent=Math.max(0,i-o);
  el.fn.textContent=data.fn??"--"; el.tracks.textContent=data.tracks??0;
  const a=Boolean(data.event_active); el.eventState.textContent=a?"ACTIVE":"IDLE"; el.eventState.style.color=a?"#ffb020":"#23c483";
  el.lastEvent.textContent=data.last_event??"--"; el.lastUpdate.textContent=new Date().toLocaleString();
}
function connect(){
  if(client){try{client.end(true)}catch(e){} client=null}
  activeTopic=(el.topicInput.value||DEFAULT_TOPIC).trim();
  const username=el.userInput.value.trim(),password=el.passInput.value;
  localStorage.setItem("jb_pc_topic",activeTopic);
  localStorage.setItem("jb_pc_user",username);
  localStorage.setItem("jb_pc_pass",password);
  el.topicView.textContent=activeTopic;
  setStatus("CONNECTING",false);
  const opt={clean:true,connectTimeout:10000,reconnectPeriod:3000,keepalive:30,clientId:"JB_PC_WEB_"+Math.random().toString(16).slice(2,10)};
  if(username)opt.username=username;if(password)opt.password=password;
  client=mqtt.connect(BROKER_WEBSOCKET_URL,opt);
  client.on("connect",()=>{setStatus("CONNECTED",true);client.subscribe(activeTopic,{qos:0},err=>{if(err)setStatus("SUBSCRIBE ERROR",false)})});
  client.on("reconnect",()=>setStatus("RECONNECTING",false));
  client.on("offline",()=>setStatus("OFFLINE",false));
  client.on("close",()=>setStatus("DISCONNECTED",false));
  client.on("error",err=>{setStatus("ERROR",false);console.error(err)});
  client.on("message",(topic,payload)=>{if(topic!==activeTopic)return;try{updatePayload(JSON.parse(payload.toString()))}catch(e){console.error("Invalid MQTT payload",e)}});
}
el.applyBtn.addEventListener("click",connect);
el.resetBtn.addEventListener("click",()=>{el.topicInput.value=DEFAULT_TOPIC;el.userInput.value="";el.passInput.value="";localStorage.removeItem("jb_pc_user");localStorage.removeItem("jb_pc_pass");localStorage.setItem("jb_pc_topic",DEFAULT_TOPIC);connect()});
connect();
})();
</script>
</body>
</html>
